 else if(t==='home'){let c='';for(let k=0;k<16;k++)c+=k===(sc.pos??9)?`<div class="me"><b>D</b><i></i></div>`:'<div class="ap"></div>';
  h=`<div class="home">${c}</div><div style="position:absolute;left:${32+((sc.pos??9)%4)*130}px;top:${130+Math.floor((sc.pos??9)/4)*138+110}px;width:104px;text-align:center;font-size:19px;font-weight:650;color:#fff">Daïmo</div>`;}
 else if(t==='todo'){h=`<div class="td"><div class="tt2">${sc.title||'À faire'}</div><div class="s2">${sc.sub||'Notes'}</div><div class="note" style="transform:none;box-shadow:none;padding:0;margin:0;background:none">${(sc.items||[]).map(x=>{const dn=x.startsWith('~');return`<div class="nl ${dn?'dn':''}"><div class="bx"></div>${dn?x.slice(1):x}</div>`}).join('')}</div></div>`;}
 return `<div class="scr">${h}<div class="isl"></div>${t==='notif'||t==='home'?'':`<div class="sb" style="color:${t==='agenda'||t==='todo'?'#1E1B2E':'#EDEBF7'}">${sc.clock||'21:04'}</div>`}<div class="hb" style="${t==='agenda'||t==='todo'?'background:#1E1B2E':''}"></div></div>`;}
function phone(sc,x,y,sc_,rot){return`<div class="pw" style="left:${x}px;top:${y}px;width:${600*sc_}px;height:${1230*sc_}px;transform:rotate(${rot||0}deg)"><div class="ph" style="transform:scale(${sc_})">${screen(sc)}</div></div>`;}
/* ---------- slides */
function slide(s,i){
 const deco=s.theme==='light'?'':'<div class="dots"></div>';
 const head=(s.type==='cover'||s.type==='cta')?'':`<div class="chip">${s.chip||D.chip}</div><div class="pg">${i+1}/${N}</div>`;
 let h='';const t=s.type;
 if(t==='cover'){
  if(s.screen){h=`<div class="chip">${D.chip}</div><div class="top fit" data-max="600">${H1(s,96)}${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>${phone(s.screen,420,640,.8,7)}<div class="swipe" style="left:84px;right:auto">Swipe ${ARR}</div>`;}
  else{h=`<div class="chip">${D.chip}</div><div class="ring" style="width:900px;height:900px;right:-380px;top:-300px"></div><div class="ring" style="width:600px;height:600px;right:-230px;top:-150px"></div><div class="mid fit">${s.kicker?`<div class="kick">${s.kicker}</div>`:''}${H1(s,112)}${s.sub?`<div class="sub">${s.sub}</div>`:''}</div><div class="swipe">Swipe ${ARR}</div>`;}}
 else if(t==='point'){
  const gh=s.n?`<div class="ghost">${s.n}</div>`:'';
  if(s.screen){h=`${gh}<div class="top fit" data-max="690">${s.kicker?`<div class="kick">${s.kicker}</div>`:''}${H1(s,80)}${s.body?`<div class="body">${s.body}</div>`:''}</div>${phone(s.screen,s.side==='left'?50:440,720,.7,s.side==='left'?-6:6)}`;}
  else h=`${gh}<div class="mid fit">${s.n?`<div class="kick">Étape ${s.n}</div>`:(s.kicker?`<div class="kick">${s.kicker}</div>`:'')}${H1(s,92)}${s.body?`<div class="body">${s.body}</div>`:''}</div>`;}
 else if(t==='phone'){h=`<div class="top fit" data-max="440" style="text-align:center">${H1(s,76)}${s.body?`<div class="body" style="margin-top:18px">${s.body}</div>`:''}</div>${phone(s.screen,306,470,.78,0)}`;}
 else if(t==='quote')h=`<div class="mid fit"><div class="qm">“</div><div class="quote">${s.text}</div>${s.who?`<div class="who">— ${s.who}</div>`:''}</div>`;
 else if(t==='list'){const st=s.style||'check';h=`<div class="mid fit">${H1(s,84)}<div class="list">${s.items.map((x,k)=>`<div class="li card"><div class="ck ${st==='cross'?'x':''}">${st==='num'?k+1:st==='cross'?'✕':CK}</div><div>${x}</div></div>`).join('')}</div></div>`;}
 else if(t==='myth')h=`<div class="mid fit">${s.title?H1(s,72):''}<div class="card myth" style="margin-top:${s.title?40:0}px"><span class="tag" style="background:#3A2531;color:#FF8FA3">${s.mythLabel||'CE QU’ON CROIT'}</span><div class="t1">${s.myth}</div></div><div class="arrow">${DOWN}</div><div class="truth"><span class="tag" style="background:rgba(255,255,255,.18);color:#fff">${s.truthLabel||'EN VRAI'}</span><div class="t2">${s.truth}</div></div></div>`;
 else if(t==='vs')h=`<div class="mid fit">${H1(s,78)}<div class="vs"><div class="col a"><div class="lab">${s.left.label}</div>${s.left.items.map(x=>`<div class="it2"><span style="color:#FF6B86;font-weight:900">✕</span><span>${x}</span></div>`).join('')}</div><div class="col bcol"><div class="lab">${s.right.label}</div>${s.right.items.map(x=>`<div class="it2"><span style="font-weight:900">✓</span><span>${x}</span></div>`).join('')}</div></div></div>`;
 else if(t==='steps')h=`<div class="mid fit">${H1(s,78)}<div class="steps">${s.items.map((x,k)=>{const[a,b]=Array.isArray(x)?x:[x,''];return`<div class="st"><div class="n">${k+1}</div><div><div class="tt">${a}</div>${b?`<div class="dd">${b}</div>`:''}</div></div>`}).join('')}</div></div>`;
 else if(t==='stat')h=`<div class="mid fit"><div class="stat">${s.value}</div>${H1(s,80)}${s.body?`<div class="body">${s.body}</div>`:''}</div>`;
 else if(t==='note')h=`<div class="mid fit">${H1(s,80)}<div class="note"><div class="nh2"><span>${s.noteTitle||'NOTES'}</span><span>${s.noteDate||'mardi, 23:47'}</span></div>${s.items.map(x=>{const dn=x.startsWith('~');return`<div class="nl ${dn?'dn':''}"><div class="bx"></div>${dn?x.slice(1):x}</div>`}).join('')}</div>${s.body?`<div class="body">${s.body}</div>`:''}</div>`;
 else if(t==='big')h=`<div class="ring" style="width:1100px;height:1100px;left:-560px;bottom:-560px"></div><div class="mid fit">${H1(s,s.fs||104)}</div>`;
 else if(t==='cta')h=`<div class="ring" style="width:1000px;height:1000px;left:40px;top:-620px"></div><div class="mid fit" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:40px"><div class="mt" style="width:150px;height:150px;flex:none;border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.35)"><b style="font-size:92px;padding-top:6px">D</b><i style="width:16px;height:16px;left:82px;top:27px"></i></div></div>${H1(s,80)}${s.sub?`<div class="sub">${s.sub}</div>`:''}<div class="cta">getdaimo.com ${ARR}</div><div style="margin-top:44px;font-size:31px;font-weight:650;color:var(--mu);line-height:1.6">💾 Enregistre ce post<br>📩 Envoie-le à quelqu’un qui en a besoin</div></div>`;
 const brand=(t==='cta'||(t==='cover'&&s.screen)||(t==='point'&&s.screen&&s.side==='left'))?'':`<div class="brand">${MT}<span>Daï<span class="mo">mo</span></span></div>`;
 return`<section class="s ${s.theme}" id="s${i+1}">${deco}<div class="c">${h}${head}${brand}</div></section>`;}
/* default themes: vary automatically if not set */
D.slides.forEach((s,i)=>{if(!s.theme)s.theme=s.type==='big'||s.type==='cta'?'violet':s.type==='quote'||s.type==='note'?'light':'dark';});
document.getElementById('root').innerHTML=D.slides.map(slide).join('');
(async()=>{await Promise.all(['800 40px Inter','700 40px Fraunces','italic 40px Instrument','40px "Noto Color Emoji"'].map(f=>document.fonts.load(f,'Daïmo 🔥 é')));await document.fonts.ready;
 const shrink=m=>m.querySelectorAll('h1,.quote,.body,.li,.sub,.t1,.t2,.it2,.tt,.dd,.nl,.stat').forEach(e=>{const f=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(f*0.95)+'px'});
 document.querySelectorAll('.fit').forEach(m=>{let k=0;const c=m.closest('.c').getBoundingClientRect();
  if(m.dataset.max){while(m.getBoundingClientRect().bottom-c.top>+m.dataset.max&&k<25){shrink(m);k++;}}
  else{while(m.getBoundingClientRect().height>1040&&k<25){shrink(m);k++;}}});
 window.READY=true;})();
</script></body></html>
